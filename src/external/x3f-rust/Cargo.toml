[package]
name = "ansel-x3f"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
publish = false

[workspace]
members = ["ffi"]
resolver = "3"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "x3f-inspect"
path = "src/bin/inspect.rs"

[[bench]]
name = "decode"
harness = false

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
